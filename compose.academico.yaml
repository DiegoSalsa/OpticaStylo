name: opticastylo-academico

services:
  web:
    image: opticastylo-academico:web
    build: .
    init: true
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - target: 3000
        host_ip: ${ACADEMIC_BIND_IP:-127.0.0.1}
        published: "${ACADEMIC_PORT:-3000}"
    environment:
      NODE_ENV: production
      DATABASE_URL: &academic_database_url "postgresql://${ACADEMIC_DB_USER:-stylo_academico}:${ACADEMIC_DB_PASSWORD:?Define ACADEMIC_DB_PASSWORD}@db:5432/${ACADEMIC_DB_NAME:-opticastylo_academico}?schema=public"
      DEPLOYMENT_ENVIRONMENT: university
      APP_PUBLIC_URL: ${ACADEMIC_PUBLIC_URL:?Define ACADEMIC_PUBLIC_URL}
      UNIVERSITY_INSECURE_HTTP_ALLOWED: "${ACADEMIC_ALLOW_HTTP:-false}"
      TRUST_PROXY: "false"
      APP_TIME_ZONE: America/Santiago
      STORE_INCLUDE_TEST_DATA: "true"
      EMAIL_MODE: disabled
      CHILEXPRESS_MODE: disabled
      CHILEXPRESS_ORDERS_ENABLED: "false"
      CHILEXPRESS_PRODUCTION_ENABLED: "false"
      OPENAI_PRESCRIPTION_READER_ENABLED: "false"
      MERCADO_PAGO_MODE: sandbox
      MERCADO_PAGO_PRODUCTION_ENABLED: "false"
      OPERATIONS_ENABLED: "false"
    networks:
      - browser
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { redirect: 'error' }).then(async response => { if (!response.ok || (await response.json()).data?.database !== 'ok') process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s

  init:
    image: opticastylo-academico:web
    pull_policy: never
    profiles: [inicializacion]
    entrypoint: ["node"]
    command: ["scripts/docker/init.mjs", "--academico"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *academic_database_url
      DEPLOYMENT_ENVIRONMENT: university
      ACADEMIC_DB_USER: ${ACADEMIC_DB_USER:-stylo_academico}
      ACADEMIC_DB_NAME: ${ACADEMIC_DB_NAME:-opticastylo_academico}
    volumes:
      - demo-credentials:/var/lib/stylo-private
    networks:
      - database

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ACADEMIC_DB_NAME:-opticastylo_academico}
      POSTGRES_USER: ${ACADEMIC_DB_USER:-stylo_academico}
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD:?Define ACADEMIC_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  browser:
  database:
    internal: true

volumes:
  postgres-data:
  demo-credentials:
