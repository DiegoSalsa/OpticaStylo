services:
  app:
    build:
      context: .
      target: runner
    image: optica-stylo:${APP_IMAGE_TAG:-local}
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /run/certificates/postgresql-ca.crt
      PORT: 3000
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${DATABASE_CA_CERT_PATH:?Define DATABASE_CA_CERT_PATH en .env.production}
        target: /run/certificates/postgresql-ca.crt
        read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      target: migration
    image: optica-stylo-migrate:${APP_IMAGE_TAG:-local}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /run/certificates/postgresql-ca.crt
    volumes:
      - type: bind
        source: ${DATABASE_CA_CERT_PATH:?Define DATABASE_CA_CERT_PATH en .env.production}
        target: /run/certificates/postgresql-ca.crt
        read_only: true
    profiles:
      - maintenance
    restart: "no"

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - edge
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN en .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
