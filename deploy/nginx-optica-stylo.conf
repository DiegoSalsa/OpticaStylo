# Limitar solicitudes por IP antes de entregarlas al servidor Next.js
limit_req_zone $binary_remote_addr zone=opticastylo_general:10m rate=20r/s;

server {
# Exponer HTTP y reenviar las solicitudes al proceso local supervisado por PM2
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

# Proteger el proxy frente a cargas de archivos excesivas
    client_max_body_size 12m;

    location / {
# Aplicar el límite de tasa y conservar cabeceras necesarias para solicitudes y websockets
        limit_req zone=opticastylo_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
