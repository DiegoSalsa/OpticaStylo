name: Despliegue Taller

# Ejecutar el despliegue del entorno Taller al actualizar ramas habilitadas o manualmente
on:
  push:
    branches: [main, testgeneral]
  workflow_dispatch:

jobs:
  deploy:
# Mantener el entorno Taller apagado hasta que la variable de habilitación esté activa
    if: vars.DESPLIEGUE_TALLER_HABILITADO == 'true'
# Usar el runner Linux instalado en el servidor del taller
    runs-on: [self-hosted, linux, x64, opticastylo-taller]
    timeout-minutes: 25

    steps:
# Descargar la revisión exacta que disparó el workflow
      - name: Checkout
        uses: actions/checkout@v4

# Seleccionar Node.js 22 y comprobar las herramientas disponibles
      - name: Preparar Node.js
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          node --version
          npm --version

# Sincronizar el código sin secretos ni artefactos locales al directorio de la aplicación
      - name: Sincronizar código al entorno Taller
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$HOME/apps/optica-stylo"
          mkdir -p "$app_dir"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.env*' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='logs' \
            --exclude='tmp' \
            ./ "$app_dir/"

# Instalar dependencias, migrar la base, validar calidad y construir la aplicación
      - name: Instalar y validar
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          cd "$HOME/apps/optica-stylo"
          unset NODE_ENV
          npm ci --include=dev
          export NODE_ENV=production
          npm run prisma:generate
          npm run db:migrate
          npm run lint
          npm test
          npm run build

# Reiniciar el servicio del entorno Taller después de una validación exitosa
      - name: Reiniciar servicio Taller
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          cd "$HOME/apps/optica-stylo"
          pm2 reload optica-stylo --update-env || pm2 start deploy/ecosystem.config.cjs
          pm2 save

      - name: Healthcheck Taller
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          pm2 logs optica-stylo --lines 80 --nostream || true
          exit 1
