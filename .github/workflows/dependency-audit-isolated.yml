name: Auditoria aislada de dependencias

on:
  push:
    branches:
      - fix/security-dependencies-oct2026

permissions:
  contents: read

jobs:
  audit:
    name: Diagnostico reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/opticastylo
    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Instalar exactamente el lockfile
        run: npm ci
      - name: Comprobar arbol de paquetes
        run: |
          npm ls --all > npm-ls.txt 2>&1 || true
          npm ls --depth=0
          npm explain sharp || true
          npm explain source-map-js || true
      - name: Diagnosticar vulnerabilidades
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [label, file] of [['FULL', 'audit-full.json'], ['PROD', 'audit-prod.json']]) {
            const obj = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`--- AUDIT ${label} ---`);
            console.log(JSON.stringify(obj.metadata?.vulnerabilities ?? {}));
            for (const [name, v] of Object.entries(obj.vulnerabilities ?? {})) {
              if (!['high', 'critical'].includes(v.severity)) continue;
              console.log(JSON.stringify({
                name, severity: v.severity, range: v.range,
                isDirect: v.isDirect, fixAvailable: v.fixAvailable,
                via: v.via?.map(x => typeof x === 'string' ? x : {name:x.name,title:x.title,url:x.url,range:x.range})
              }));
            }
          }
          NODE
      - name: Diagnostico de propuesta sin modificar archivos
        run: |
          npm audit fix --dry-run --json > audit-proposal.json || true
          git status --short
