name: Procesar correos transaccionales

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procesar-correos-transaccionales
  cancel-in-progress: false

jobs:
  procesar:
    name: Procesar lote pendiente
    if: github.event_name == 'workflow_dispatch' || vars.EMAIL_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      EMAIL_WORKER_URL: https://optica-stylo.vercel.app/api/internal/transactional-emails/process
    steps:
      - name: Validar secreto del trabajador
        shell: bash
        run: |
          if (( ${#CRON_SECRET} < 16 )); then
            echo "::error::Falta configurar CRON_SECRET con al menos 16 caracteres en GitHub Actions."
            exit 1
          fi

      - name: Solicitar procesamiento
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            --max-time 45 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${EMAIL_WORKER_URL}"
