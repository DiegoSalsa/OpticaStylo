name: Calidad

on:
  pull_request:
  push:
    branches:
      - main
      - testgeneral
      - "integration/**"
      - "codex/**"
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  quality:
    name: Validar aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Prisma solo necesita una URL con formato válido en estas comprobaciones.
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/opticastylo
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run prisma:generate

      - name: Validar schema Prisma
        run: npm run prisma:validate

      - name: Ejecutar lint
        run: npm run lint

      - name: Preparar herramientas aisladas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          npx playwright install --with-deps chromium

      - name: Ejecutar tests
        run: npm test

      - name: Verificar seguridad y adaptadores sin proveedores reales
        run: npm run test:security

      - name: Construir aplicación
        run: npm run build
