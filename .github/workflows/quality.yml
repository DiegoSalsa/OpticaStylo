name: Calidad

on:
  pull_request:
  push:
    branches:
      - main
      - testgeneral
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  quality:
    name: Validar aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma solo necesita una URL con formato válido en estas comprobaciones.
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/opticastylo
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run prisma:generate

      - name: Validar schema Prisma
        run: npm run prisma:validate

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Construir aplicación
        run: npm run build
